name: aeterna_protocol
description: Eredità Digitale Dinamica — Digital Legacy Platform
publish_to: 'none'
version: 2.4.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  pointycastle: ^4.0.0
  cryptography: ^2.7.0

  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
