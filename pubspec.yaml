  open_filex: ^4.5.0

  dio: ^5.7.0
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.17

  http: ^1.2.2
  supabase_flutter: ^2.8.0
  supabase: ^2.6.3
  flutter_dotenv: ^5.2.1
  crypto: ^3.0.5
  flutter_stripe: ^11.3.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.4
