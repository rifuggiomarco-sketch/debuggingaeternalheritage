name: aeterna_protocol
description: Eredità Digitale Dinamica — Digital Legacy Platform
publish_to: 'none'
version: 2.4.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  pointycastle: ^4.0.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^10.1.0
  local_auth: ^3.0.1
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  dio: ^5.7.0
  # js package removed - use dart:html or package:web instead
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.17
  flutter_localizations:
    sdk: flutter

  http: any
  supabase_flutter: any
  flutter_dotenv: any
  crypto: any
  flutter_stripe: any
  supabase: any
  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.5.4

  mockito: any
  http: any
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: DMM
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
